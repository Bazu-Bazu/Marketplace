server:
  port: ${SERVER_PORT}

spring:
  application:
    name: cart-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 300000
      idle-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/migrations/db.migrations.yaml

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: marketplace-seller-service-group
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

grpc:
  client:
    product-service:
      address: ${PRODUCT_SERVICE_GRPC_ADDRESS}
      negotiationType: plaintext

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka